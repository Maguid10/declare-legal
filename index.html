<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Declare</title>
  <style>
    :root { --bg:#0a0a0a; --fg:#fff; --muted:#9a9aa0; --accent:#8b5cf6; --card:#161618; --line:rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
    .wrap { max-width:680px; margin:0 auto; padding:64px 24px; }
    h1 { font-size:40px; letter-spacing:-1px; margin:0 0 8px; }
    .tag { color:var(--muted); font-size:18px; margin:0 0 40px; }
    .links { display:flex; flex-direction:column; gap:12px; }
    a.btn { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; color:var(--fg); text-decoration:none; font-weight:600; transition:border-color .15s; }
    a.btn:hover { border-color:var(--accent); }
    .foot { color:var(--muted); font-size:14px; margin-top:48px; }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Declare</h1>
    <p class="tag">Declare who you already are.</p>
    <div class="links">
      <a class="btn" href="./support.html">Support</a>
      <a class="btn" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./terms.html">Terms of Service</a>
    </div>
    <p class="foot">Questions? <a href="mailto:maguidguebre10@gmail.com">Contact us</a></p>
  </div>
</body>
</html>
